[package]
name = "agent-ledger"
description = "An append-only block ledger and orchestration runtime for LLM agents."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "agent_ledger"

[lints]
workspace = true

# No vendor is on by default. Every consumer names the ones it uses, because a
# default vendor is a dependency tree a consumer never asked for and a model
# boundary it never chose. The trait, the neutral vocabulary, the stream
# contract, the render pass and the registries are always present — a vendor
# feature adds a wire, never a capability the rest of the layer depends on.
#
# The underscore-prefixed features are internal wiring, not a public surface:
# `_sse` carries the event-stream reader every vendor needs, `_chat_stream`
# carries the shared chat-completions stream decoder — read by every vendor
# whose RESPONSES take that shape, including one that builds its own requests —
# and `_chat` carries the request base on top of it, which two vendors compose
# with. Naming any of them directly buys a consumer nothing.
[features]
default = []
anthropic = ["_sse", "dep:base64"]
kimi = ["_chat_stream", "dep:uuid"]
mistral = ["_chat"]
openai = ["_sse"]
openrouter = ["_chat"]
_chat = ["_chat_stream", "dep:base64"]
_chat_stream = ["_sse"]
_sse = ["dep:eventsource-stream"]

# The dependency set is deliberately small and stays that way: a library that
# drags a consumer's toolchain into every dependent tree is the coupling this
# crate exists to remove. Serialization, an async runtime for the reactive
# primitives and the bus, structured logging, the embedded database the ledger
# is stored in, and — since the provider layer — the HTTP and stream machinery
# the model boundary is made of.
[dependencies]
# The composing-enum derive, re-exported so one `use agent_ledger::Agency`
# brings the trait and its derive together. A build-host dependency in effect:
# a procedural macro is never linked into a consumer's binary.
agent-ledger-derive = { path = "../agent-ledger-derive", version = "0.1.0" }
# The image bytes' wire encoding. Only the wires that carry an image part read
# it, so it rides in with those features. Default features are off: they add a
# SIMD path built on unsafe code, and this crate forbids unsafe — the scalar
# engine encodes a chat image's worth of bytes without measurable cost.
base64 = { version = "0.23.1", default-features = false, features = [
    "std",
], optional = true }
chrono = "0.4"
# The wire an event stream arrives on. Only a vendor module reads one, so it
# rides in with the first vendor a consumer enables.
eventsource-stream = { version = "0.2", optional = true }
# The stream contract itself: a turn's events are a `Stream`, so this is named
# by the always-present layer and cannot be feature-gated.
futures = "0.3"
# No TLS feature is named on purpose — see docs/dependency-review.md. `stream`
# is the byte stream an SSE reader is built on; `json` is every request body.
reqwest = { version = "0.13", features = ["json", "stream"] }
# `bundled` compiles SQLite from vendored source, so a consumer needs no system
# library and every build gets the same engine. `hooks` is the row change hook
# the reactive change log is driven from — without it the scheduler has no
# heartbeat.
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"
# `time` is the stream watchdog and the retry backoff, and `macros` is the
# select the bind loop races cancellation on. Both live in the bind loop, which
# is always present, so neither is a test-only convenience.
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# The cancellation token an active turn is interrupted through.
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
# One vendor identifies its client by a generated id; nothing else needs it.
uuid = { version = "1", features = ["v4"], optional = true }

# Test-only. Cargo unifies features across a dependency graph, so a runtime
# flavour or a timer wheel declared above would be inherited by every
# dependent whether it wanted them or not. `test-util` is the paused clock the
# bind loop's backoff tests run on — without it a retry test would sleep for
# the real five minutes.
#
# The self dev-dependency turns a base-composing vendor on for test builds
# only. The request base and its wire pins live behind the internal `_chat`
# feature, off in every production build because no default vendor composes
# with it — but a bare `cargo test --workspace` would then never compile the
# base, and a change to its request builder would report green untested.
# `openrouter` is the vendor picked to carry it here: it fills the base's
# seams, so the compiled base has a constructor for every wire type and no
# dead code, which `_chat` alone would leave. A dev-dependency's features unify
# onto the crate under test and nowhere else (resolver 3 keeps them out of
# normal builds and out of `cargo check`), so this exercises the base under the
# default gate without adding a vendor to any consumer's tree.
[dev-dependencies]
agent-ledger = { path = ".", features = ["openrouter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
